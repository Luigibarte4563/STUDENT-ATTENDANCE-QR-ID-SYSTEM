<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - QR Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom font and base styling */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center mb-2">
                <i data-lucide="qr-code" class="text-blue-600 mr-2 w-6 h-6"></i>
                <span class="text-2xl font-extrabold text-blue-600">QR Attend System</span>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Admin Login</h2>
            <p class="text-sm text-gray-500 font-semibold mt-1">Access the Admin Dashboard</p>
        </div>

        <div class="bg-white p-8 rounded-xl shadow-2xl border border-gray-200">
            <div id="authError" class="text-sm text-red-600 mb-4 p-3 bg-red-50 border border-red-200 rounded hidden"></div>
            
            <form id="loginForm">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <input type="email" id="email" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 pr-4 py-2 border-gray-300 rounded-md" placeholder="admin@college.edu" required>
                    </div>
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <input type="password" id="password" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 pr-4 py-2 border-gray-300 rounded-md" placeholder="************" required>
                    </div>
                </div>
                
                <button type="submit" class="w-full flex items-center justify-center px-4 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150" id="loginButton">
                    <i data-lucide="log-in" class="w-5 h-5 mr-2"></i>
                    Login
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-600">
                <a href="adminSignUpPage.html" class="font-semibold text-blue-600 hover:text-blue-700 transition duration-150">
                    Don't have an account? Sign Up
                </a>
            </p>
        </div>
    </div>

    <script type="module">
        lucide.createIcons();
        
        // --- Firebase Imports and Configuration ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // IMPORTANT: Use your actual Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDq64gpsq2NzC7EA1V00WZ-yYGzHSKYMLA",
            authDomain: "studentattendanceqridsys.firebaseapp.com",
            databaseURL: "https://studentattendanceqridsys-default-rtdb.firebaseio.com",
            projectId: "studentattendanceqridsys",
            storageBucket: "studentattendanceqridsys.firebasestorage.app",
            messagingSenderId: "666194808312",
            appId: "1:666194808312:web:4b919a6900833ce51b9a0d",
            measurementId: "G-XFK13STCJK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // --- Configuration Constants ---
        const DASHBOARD_URL = 'adminDashboard.html';

        // --- DOM Elements ---
        const loginForm = document.getElementById('loginForm');
        const authError = document.getElementById('authError');
        const loginButton = document.getElementById('loginButton');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // ------------------------------------------------------------------------------------------------
        // Login Logic
        // ------------------------------------------------------------------------------------------------

        /** Handles the Firebase sign-in process. */
        async function handleLogin(email, password) {
            // **FIX:** Removed the insecure client-side check (Step 1 from the original plan)
            // We now rely solely on Firebase for authentication.
            
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            console.log("Admin logged in successfully:", userCredential.user);

            // Redirect to the dashboard on success
            window.location.href = DASHBOARD_URL; 
        }
        
        // ------------------------------------------------------------------------------------------------
        // Form Submission Handler
        // ------------------------------------------------------------------------------------------------

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value;
            const password = passwordInput.value;

            // UI Reset/Loading State
            authError.classList.add('hidden');
            authError.textContent = '';
            loginButton.disabled = true;
            
            // Set Loading Icon
            loginButton.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 mr-2 animate-spin"></i> Logging in...';
            lucide.createIcons();

            try {
                await handleLogin(email, password);
                
            } catch (error) {
                console.error("Login failed:", error);
                
                let message = 'An unexpected error occurred.';

                // Detailed Firebase Error Mapping
                switch (error.code) {
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential':
                        message = 'Invalid email or password.';
                        break;
                    case 'auth/too-many-requests':
                        message = 'Access temporarily blocked due to too many failed attempts. Please wait and try again.';
                        break;
                    case 'auth/invalid-email':
                        message = 'The provided email is invalid.';
                        break;
                    default:
                        // Display generic message or a slightly cleaner version of the error
                        message = `Authentication Error: Please check your network or try again. (${error.code || error.message})`;
                }
                
                authError.textContent = message;
                authError.classList.remove('hidden');
                
            } finally {
                // Restore button state
                loginButton.disabled = false;
                loginButton.innerHTML = '<i data-lucide="log-in" class="w-5 h-5 mr-2"></i> Login';
                lucide.createIcons();
            }
        });
        
        // Initial icon rendering
        lucide.createIcons();
    </script>
</body>
</html>
